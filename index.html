<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sistema Escolar</title>

        <link rel="stylesheet" href="style.css">
    </head>
<body>

<div class="container">

    <header>
        <h1>🎓 Sistema Escolar</h1>
    </header>

    <section class="dashboard">

        <div class="card">
            <h2 id="totalAlunos">0</h2>
            <p>Alunos</p>
        </div>

        <div class="card aprovado">
            <h2 id="aprovados">0</h2>
            <p>Aprovados</p>
        </div>

        <div class="card recuperacao">
            <h2 id="recuperacao">0</h2>
            <p>Recuperação</p>
        </div>

        <div class="card reprovado">
            <h2 id="reprovados">0</h2>
            <p>Reprovados</p>
        </div>

    </section>

    <section class="formulario">

        <input type="text" id="nome" placeholder="Nome do aluno">

        <input type="text" id="matricula" placeholder="Matrícula">

        <input type="text" id="turma" placeholder="Turma">

         <input type="number" id="n1" placeholder="Nota 1">

        <input type="number" id="n2" placeholder="Nota 2">

        <input type="number" id="n3" placeholder="Nota 3">

        <input type="number" id="n4" placeholder="Nota 4">

        <button onclick="adicionarAluno()">
            Salvar Aluno
        </button>

    </section>

    <section>

        <input
        type="text"
        id="pesquisa"
        placeholder="🔍 Pesquisar aluno">

    </section>

    <section class="tabela">

        <table>

            <thead>

                <tr>
                    <th>Nome</th>
                    <th>Turma</th>
                    <th>Média</th>
                    <th>Situação</th>
                    <th>Ações</th>
                </tr>

            </thead>

            <tbody id="listaAlunos">

            </tbody>

        </table>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
